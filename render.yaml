services:
  - type: web
    name: sazon-express
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app import crear_tabla; crear_tabla()" && gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
